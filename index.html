@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#161416; --surface:#211e21; --ink:#f6f1f3; --muted:#bdb3b8; --line:#3a3438;
    --link:#ff8fae; --btn:#F08A9F; --btn-ink:#1D1D1B; --soft:#2a2126; --grain:none;
    --blue:#3A74D9; --mag:#E0468A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#161416; --surface:#211e21; --ink:#f6f1f3; --muted:#bdb3b8; --line:#3a3438;
  --link:#ff8fae; --btn:#F08A9F; --btn-ink:#1D1D1B; --soft:#2a2126; --grain:none;
  --blue:#3A74D9; --mag:#E0468A;
  color-scheme:dark;
}
/* cor de cada área: --c fundo, --on texto sobre o fundo, --ti cor do texto dentro da etiqueta branca */
.c-geral,.c-pink{--c:var(--pink);--on:#fff;--ti:#E8336B}
.c-wine{--c:var(--wine);--on:#fff;--ti:#A7315D}
.c-rose{--c:var(--rose);--on:#1D1D1B;--ti:#A7315D}
.c-blush{--c:var(--blush);--on:#1D1D1B;--ti:#A7315D}
.c-movimento{--c:var(--red);--on:#fff;--ti:#C60B20}
.c-base{--c:var(--green);--on:#fff;--ti:#05873F}
.c-performance{--c:var(--gold);--on:#1D1D1B;--ti:#8F6A00}
.c-conexao{--c:var(--blue);--on:#fff;--ti:#15438E}

*{box-sizing:border-box}
html{scroll-padding-top:72px}
body{margin:0;background:var(--paper) var(--grain);color:var(--ink);font:400 16px/1.6 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit}
h1,h2,h3{margin:0;font-family:var(--font);line-height:1.15;letter-spacing:-.01em}
p{margin:0}
:focus-visible{outline:3px solid var(--wine);outline-offset:2px}
:root[data-theme="dark"] :focus-visible{outline-color:var(--rose)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) :focus-visible{outline-color:var(--rose)}}
.skip{position:absolute;left:8px;top:-60px;background:var(--btn);color:var(--btn-ink);padding:8px 14px;z-index:100;font-weight:600}
.skip:focus{top:8px}

/* logo e estampa (máscaras extraídas do modelo de slide) */
.logo,.lg{display:block;background:currentColor;aspect-ratio:560/362;
  -webkit-mask:var(--m-logo) center/contain no-repeat;mask:var(--m-logo) center/contain no-repeat}
.squig{position:absolute;display:block;width:clamp(120px,18vw,210px);aspect-ratio:520/176;pointer-events:none;
  background:color-mix(in srgb,#fff 42%,var(--c));
  -webkit-mask:var(--m-squig) center/contain no-repeat;mask:var(--m-squig) center/contain no-repeat}
.squig.tl{left:clamp(14px,3vw,36px);top:clamp(14px,3vw,30px)}
.squig.br{right:clamp(14px,3vw,36px);bottom:clamp(14px,3vw,30px)}

/* estrutura */
.draft{background:var(--butter);color:#1D1D1B;padding:8px 16px;font-size:13.5px;text-align:center;font-weight:500}
.app{display:grid;grid-template-columns:1fr;min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:800;font-size:16px;line-height:1.05;letter-spacing:-.01em}
.brand .lg{width:46px;color:var(--pink);flex:none}
.menu-btn{font:600 14px/1 var(--font);border:2px solid var(--ink);background:var(--surface);color:var(--ink);padding:10px 14px;cursor:pointer}
.side{position:fixed;inset:0 auto 0 0;width:min(84vw,300px);z-index:40;background:var(--surface);
  border-right:1px solid var(--line);padding:22px 14px 28px;overflow-y:auto;transform:translateX(-102%);transition:transform .2s ease}
.side.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(20,10,16,.55);z-index:35;display:none}
.scrim.on{display:block}
.side .brand{padding:4px 10px 20px}
.grp{font-size:13px;font-weight:600;color:var(--muted);padding:16px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;text-decoration:none;font-weight:500;font-size:15px}
.nav:hover{background:var(--soft)}
.nav[aria-current="page"]{background:var(--soft);font-weight:700;box-shadow:inset 4px 0 0 var(--c,var(--pink))}
.dot{width:11px;height:11px;background:var(--c,var(--pink));flex:none}
main{padding:0;width:100%;min-width:0}
main:focus,main:focus-visible{outline:none}
.wrap{max-width:960px;margin:0 auto;padding:36px 20px 24px}

@media (min-width:920px){
  .app{grid-template-columns:288px 1fr}
  .topbar,.scrim{display:none!important}
  .side{position:sticky;top:0;height:100vh;width:auto;transform:none;z-index:1}
  .wrap{padding:48px 44px 32px}
}

/* faixa de abertura de cada página, como nos slides */
.band{position:relative;overflow:hidden;background:var(--c);color:var(--on);padding:76px 22px 68px}
.band-in{position:relative;max-width:960px;margin:0 auto}
@media (min-width:920px){.band{padding:92px 44px 84px}}
.tt{background:#fff;color:var(--ti);padding:0 .2em;-webkit-box-decoration-break:clone;box-decoration-break:clone;
  font-weight:700;line-height:1.5;letter-spacing:-.02em}
.band h1{font-size:clamp(34px,6vw,58px)}
.band-sub{margin-top:18px;max-width:46ch;font-size:19px;font-weight:500;line-height:1.5}
.btn{display:inline-block;margin-top:24px;font:600 15px/1 var(--font);background:#fff;color:#1D1D1B;text-decoration:none;padding:14px 18px;border:0}
.btn[aria-disabled="true"]{background:rgba(255,255,255,.35);color:inherit;cursor:not-allowed}

.hero{text-align:center;padding-block:64px 72px;color:#fff}
.hero .band-in{display:flex;flex-direction:column;align-items:center}
.hero .logo{width:clamp(120px,22vw,190px);color:#fff}
.hero h1{margin-top:22px;font-size:clamp(34px,7vw,68px);font-weight:800;text-transform:uppercase;letter-spacing:-.02em;line-height:1.02}
.hero .band-sub{font-style:italic;font-weight:300;font-size:clamp(19px,3vw,26px);margin-top:12px;max-width:none}

/* estampa: retalhos do Reconcentre 13 */
.patch{--s:84px;display:grid;grid-template-rows:repeat(2,var(--s));grid-auto-flow:column;grid-auto-columns:var(--s);overflow:hidden;height:calc(var(--s)*2)}
.patch.one{grid-template-rows:var(--s);height:var(--s)}
.ptile{display:grid;place-items:center}
.ptile svg{width:70%;height:70%}
.ptile .lg{width:72%}
@media (min-width:600px){.patch{--s:104px}}

/* títulos e textos */
.page-lede{color:var(--muted);max-width:58ch}
h2.sec{font-size:22px;font-weight:700;margin:52px 0 16px;padding-bottom:10px;position:relative}
h2.sec::after{content:"";position:absolute;left:0;bottom:0;width:44px;height:5px;background:var(--c,var(--pink))}
.linkish{font-weight:600;color:var(--link);text-underline-offset:3px}
.muted{color:var(--muted)}
.home-h{margin-top:0}

/* comunidades */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(205px,1fr))}
.tile{display:flex;flex-direction:column;gap:12px;padding:20px 18px 18px;text-decoration:none;background:var(--c);color:var(--on);min-height:200px}
.tile:hover{filter:brightness(1.06)}
.tile .tt{align-self:flex-start;font-size:24px;font-weight:700}
.tile-desc{font-size:14.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile-meta{margin-top:auto;font-size:13.5px;font-weight:600}

.cols{display:grid;gap:8px 44px;grid-template-columns:1fr}
@media (min-width:800px){.cols{grid-template-columns:1.15fr 1fr}}

/* filtros */
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px;align-items:center}
.chip{font:500 14px/1 var(--font);border:2px solid var(--ink);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer;border-radius:999px}
.chip:hover{background:var(--soft)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.search{width:100%;font:400 16px/1.2 var(--font);padding:13px 14px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);margin:0 0 16px}
.count{font-size:13.5px;color:var(--muted);margin:10px 0 4px}

.tag{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.demo{font-size:12px;font-weight:600;background:var(--butter);color:#1D1D1B;padding:1px 7px;margin-left:8px;vertical-align:middle}

/* avisos */
.post{padding:20px 0;border-bottom:1px solid var(--line)}
.post:first-child{padding-top:4px}
.post-top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13.5px;color:var(--muted);margin-bottom:6px}
.post h3{font-size:20px;font-weight:700}
.post p{margin-top:8px;max-width:64ch}

/* eventos */
.event{display:grid;grid-template-columns:68px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.dateblock{background:var(--c);color:var(--on);text-align:center;padding:8px 0 9px;align-self:start}
.dateblock b{display:block;font-size:28px;font-weight:800;line-height:1.05}
.dateblock span{font-size:12.5px;font-weight:600}
.event h3{font-size:18px;font-weight:700}
.event .meta{font-size:14px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.past{opacity:.7}
details.past-wrap{margin-top:22px}
details summary{cursor:pointer;font-weight:600;padding:8px 0}

/* materiais */
.mat{display:grid;grid-template-columns:56px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.mtype{height:56px;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--c);color:var(--on)}
.mat h3{font-size:17.5px;font-weight:600}
.mat h3 a{text-decoration-thickness:2px;text-underline-offset:3px}
.mat p{font-size:14.5px;color:var(--muted);margin-top:2px}
.mat .meta{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}

/* time */
.people{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.person{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--c);padding:16px;display:flex;flex-direction:column;gap:4px}
.avatar{width:56px;height:56px;display:grid;place-items:center;font-size:19px;font-weight:800;background:var(--c);color:var(--on);margin-bottom:8px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.person h3{font-size:17px;font-weight:700}
.person .role{font-size:14.5px;color:var(--muted)}
.person .tag{margin-top:6px}

.empty{padding:18px 0;color:var(--muted)}
.foot{margin-top:48px;padding-top:18px;font-size:13.5px;color:var(--muted)}
.foot-patch{margin-top:40px}

@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>
</head>
<body>
<a class="skip" href="#main">Pular para o conteúdo</a>
<div id="draft"></div>
<div class="app">
  <header class="topbar">
    <a class="brand" href="#/" id="brand-top"></a>
    <button class="menu-btn" id="menu" type="button" aria-expanded="false" aria-controls="side">Menu</button>
  </header>
  <div class="scrim" id="scrim"></div>
  <nav class="side" id="side" aria-label="Navegação principal"></nav>
  <main id="main" tabindex="-1"><noscript>Ative o JavaScript para ver o portal.</noscript></main>
</div>

<script>
/* =========================================================
   CONTEÚDO DO PORTAL
   Tudo o que aparece no site vem daqui. Para atualizar, edite
   só este bloco (avisos, materiais, eventos e time).
   comunidade: "geral" (toda a rede), "movimento", "base",
   "performance" ou "conexao". Itens com exemplo:true mostram
   a etiqueta "Exemplo" e devem ser substituídos.
   foto (opcional, no time): imagem embutida (data:image/...).
   ========================================================= */
const CONTENT = {
  nome: "Núcleo Central",
  rascunho: true,
  atualizadoEm: "2026-09-21",
  comunidades: [
    { id:"movimento",   nome:"Movimento",   descricao:"Descreva aqui, em uma ou duas frases, o que é a comunidade Movimento e para quem ela é.", chat:{ rotulo:"Entrar no chat do Movimento", url:"" } },
    { id:"base",        nome:"Base",        descricao:"Descreva aqui, em uma ou duas frases, o que é a comunidade Base e para quem ela é.",        chat:{ rotulo:"Entrar no chat da Base", url:"" } },
    { id:"performance", nome:"Performance", descricao:"Descreva aqui, em uma ou duas frases, o que é a comunidade Performance e para quem ela é.", chat:{ rotulo:"Entrar no chat da Performance", url:"" } },
    { id:"conexao",     nome:"Conexão",     descricao:"Descreva aqui, em uma ou duas frases, o que é a comunidade Conexão e para quem ela é.",     chat:{ rotulo:"Entrar no chat da Conexão", url:"" } }
  ],
  avisos: [
    { titulo:"Título de um aviso para toda a rede", data:"2026-09-16", comunidade:"geral", texto:"Escreva aqui o aviso. Os mais recentes aparecem primeiro, na página inicial e em Avisos.", exemplo:true },
    { titulo:"Aviso da comunidade Movimento", data:"2026-09-12", comunidade:"movimento", texto:"Avisos de uma comunidade também aparecem na página dela.", exemplo:true },
    { titulo:"Aviso da comunidade Base", data:"2026-09-08", comunidade:"base", texto:"Use este formato para novidades, prazos e comunicados.", exemplo:true }
  ],
  materiais: [
    { id:"teste-lorem", titulo:"Material de teste", tipo:"Texto", comunidade:"movimento", descricao:"Página de teste com texto completo, aberta dentro do próprio portal.", exemplo:true,
      corpo:"Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.\n\nDuis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.\n\nSed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium, totam rem aperiam, eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt explicabo." },
    { titulo:"Nome de um material geral", tipo:"PDF", url:"", comunidade:"geral", descricao:"Uma linha dizendo para que serve este material.", exemplo:true },
    { titulo:"Planilha de acompanhamento", tipo:"Planilha", url:"", comunidade:"movimento", descricao:"Exemplo de material de uma comunidade.", exemplo:true },
    { titulo:"Gravação de um encontro", tipo:"Vídeo", url:"", comunidade:"base", descricao:"Exemplo de vídeo ou gravação.", exemplo:true },
    { titulo:"Guia de boas práticas", tipo:"Doc", url:"", comunidade:"performance", descricao:"Exemplo de documento de texto.", exemplo:true },
    { titulo:"Página com links úteis", tipo:"Link", url:"", comunidade:"conexao", descricao:"Exemplo de link para outro site.", exemplo:true }
  ],
  eventos: [
    { titulo:"Nome de um evento da rede", data:"2026-10-03", hora:"19h", local:"Online", comunidade:"geral", url:"", exemplo:true },
    { titulo:"Encontro da Performance", data:"2026-10-15", hora:"18h30", local:"Local a definir", comunidade:"performance", url:"", exemplo:true },
    { titulo:"Encontro da Base", data:"2026-09-05", hora:"19h", local:"Online", comunidade:"base", url:"", exemplo:true }
  ],
  time: [
    { nome:"Nome Sobrenome", cargo:"Cargo no núcleo", comunidade:"movimento", contato:"", foto:"", exemplo:true },
    { nome:"Nome Sobrenome", cargo:"Cargo no núcleo", comunidade:"base", contato:"", foto:"", exemplo:true },
    { nome:"Nome Sobrenome", cargo:"Cargo no núcleo", comunidade:"performance", contato:"", foto:"", exemplo:true },
    { nome:"Nome Sobrenome", cargo:"Cargo no núcleo", comunidade:"conexao", contato:"", foto:"", exemplo:true }
  ]
};

/* ---------- utilidades ---------- */
const COM = Object.fromEntries(CONTENT.comunidades.map(c => [c.id, c]));
const hoje = new Date(); hoje.setHours(0,0,0,0);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs || {})){
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
}
const safeUrl = u => /^(https?:\/\/|mailto:)/i.test(u || "") ? u : "";
const safeImg = u => /^data:image\/(png|jpe?g|webp|gif);base64,/i.test(u || "") ? u : "";
const parseDate = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const fmtDay = d => d.toLocaleDateString("pt-BR", { day:"numeric", month:"short" }).replace(".", "");
const fmtFull = d => d.toLocaleDateString("pt-BR", { day:"numeric", month:"long", year:"numeric" });
const fmtMonth = d => d.toLocaleDateString("pt-BR", { month:"long", year:"numeric" });
const norm = s => (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const slug = s => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const matSlug = m => m.id || slug(m.titulo);
const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;
const comName = id => id === "geral" ? "Toda a rede" : (COM[id] ? COM[id].nome : id);
const tag = id => h("span", { class:`tag c-${id}` }, h("span", { class:"dot" }), comName(id));
const demo = it => it.exemplo ? h("span", { class:"demo" }, "Exemplo") : null;
const FILTERS = [{ id:"todos", label:"Todos" }, { id:"geral", label:"Toda a rede" }, ...CONTENT.comunidades.map(c => ({ id:c.id, label:c.nome }))];
const F = { avisos:"todos", materiais:"todos", agenda:"todos", time:"todos", q:"" };
const byCom = (list, f) => list.filter(i => f === "todos" || i.comunidade === f);
const avisosOrd = () => [...CONTENT.avisos].sort((a,b) => parseDate(b.data) - parseDate(a.data));
const proximos = () => CONTENT.eventos.filter(e => parseDate(e.data) >= hoje).sort((a,b) => parseDate(a.data) - parseDate(b.data));
const passados = () => CONTENT.eventos.filter(e => parseDate(e.data) < hoje).sort((a,b) => parseDate(b.data) - parseDate(a.data));

function chips(key, onChange){
  const wrap = h("div", { class:"bar", role:"group", "aria-label":"Filtrar por comunidade" });
  const draw = () => {
    wrap.replaceChildren(...FILTERS.map(f => h("button", {
      class:"chip", type:"button", "aria-pressed": String(F[key] === f.id),
      onclick: () => { F[key] = f.id; draw(); onChange(); }
    }, f.label)));
  };
  draw();
  return wrap;
}

/* ---------- estampa de retalhos (elementos do Reconcentre 13) ---------- */
const PAL = { B:"#15438E", Y:"#D6A424", G:"#05873F", M:"#C51858", R:"#C60B20", W:"#E6E4E5", K:"#1D1D1B", P:"#E8336B" };
function starPts(n, R, r, seed){
  let s = seed; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const pts = [];
  for (let i = 0; i < n * 2; i++){
    const a = Math.PI * i / n - Math.PI / 2 + (rnd() - .5) * .16;
    const rad = (i % 2 ? r : R) * (.9 + rnd() * .18);
    pts.push((50 + rad * Math.cos(a)).toFixed(1) + "," + (50 + rad * Math.sin(a)).toFixed(1));
  }
  return pts.join(" ");
}
function flowerSvg(){
  let c = "";
  for (let i = 0; i < 6; i++){
    const a = Math.PI / 3 * i;
    c += `<circle cx="${(50 + 25 * Math.cos(a)).toFixed(1)}" cy="${(50 + 25 * Math.sin(a)).toFixed(1)}" r="15"/>`;
  }
  return `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round">${c}<circle cx="50" cy="50" r="8"/></svg>`;
}
const EL = {
  star4:  (fg, bg, i) => `<svg viewBox="0 0 100 100"><polygon fill="${fg}" points="${starPts(4, 47, 14, 11 + i)}"/></svg>`,
  star8:  (fg, bg, i) => `<svg viewBox="0 0 100 100"><polygon fill="${fg}" points="${starPts(8, 47, 21, 29 + i)}"/></svg>`,
  flower: (fg) => flowerSvg().replace("currentColor", fg),
  spiral: (fg) => `<svg viewBox="0 0 100 100"><path d="M12 14H88V88H20V28H74V74H34V42H60V60" fill="none" stroke="${fg}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  vinyl:  () => `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="#1D1D1B"/><g fill="none" stroke="#6a6a68" stroke-width="1.4"><circle cx="50" cy="50" r="40"/><circle cx="50" cy="50" r="33"/><circle cx="50" cy="50" r="26"/></g><circle cx="50" cy="50" r="15" fill="#E8336B"/><circle cx="50" cy="50" r="2.6" fill="#1D1D1B"/></svg>`,
  cup:    (fg, bg) => `<svg viewBox="0 0 100 100"><path d="M24 12H76L67 90H33Z" fill="${fg}"/><path d="M40 28V78M50 28V78M60 28V78" stroke="${bg}" stroke-width="5" stroke-linecap="round"/></svg>`,
  logo:   (fg) => `<span class="lg" style="color:${fg}"></span>`
};
const TILES = [["B","#fff","cup"],["Y","R","flower"],["R","G","star4"],["P","#fff","logo"],["G","Y","star8"],["B","Y","spiral"],["M","K","vinyl"],["W","B","star4"]];
function patch(rows){
  const n = 22, out = [];
  for (let col = 0; col < n; col++){
    for (let row = 0; row < rows; row++){
      const [bg, fg, el] = TILES[(col + row * 3) % TILES.length];
      const bgc = PAL[bg], fgc = PAL[fg] || fg;
      out.push(`<div class="ptile" style="background:${bgc}">${EL[el](fgc, bgc, col + row)}</div>`);
    }
  }
  const box = h("div", { class:"patch" + (rows === 1 ? " one" : ""), "aria-hidden":"true" });
  box.innerHTML = out.join("");
  return box;
}

/* ---------- blocos de conteúdo ---------- */
function postEl(a){
  return h("article", { class:"post" },
    h("div", { class:"post-top" }, tag(a.comunidade), h("span", {}, fmtFull(parseDate(a.data))), demo(a)),
    h("h3", {}, a.titulo),
    h("p", {}, a.texto));
}
function eventEl(e, isPast){
  const d = parseDate(e.data), url = safeUrl(e.url);
  return h("article", { class:`event c-${e.comunidade}${isPast ? " past" : ""}` },
    h("div", { class:"dateblock" }, h("b", {}, String(d.getDate())), h("span", {}, d.toLocaleDateString("pt-BR", { month:"short" }).replace(".", ""))),
    h("div", {},
      h("h3", {}, e.titulo, demo(e)),
      h("div", { class:"meta" }, tag(e.comunidade), [e.hora, e.local].filter(Boolean).join(", "),
        url ? h("a", { class:"linkish", href:url, target:"_blank", rel:"noopener" }, "Mais informações") : null)));
}
function matEl(m){
  const url = safeUrl(m.url), interno = !url && m.corpo;
  const titleLink = interno ? h("a", { href:`#/m/${matSlug(m)}` }, m.titulo)
    : url ? h("a", { href:url, target:"_blank", rel:"noopener" }, m.titulo) : m.titulo;
  return h("article", { class:`mat c-${m.comunidade}` },
    h("div", { class:"mtype", "aria-hidden":"true" }, m.tipo || "Link"),
    h("div", {},
      h("h3", {}, titleLink, demo(m)),
      m.descricao ? h("p", {}, m.descricao) : null,
      h("div", { class:"meta" }, tag(m.comunidade), url || interno ? null : h("span", { class:"muted", style:"font-size:13px" }, "Link ainda não disponível"))));
}
function personEl(p){
  const ini = p.nome.split(/\s+/).filter(Boolean).slice(0,2).map(s => s[0].toUpperCase()).join("");
  const url = safeUrl(p.contato), foto = safeImg(p.foto);
  return h("article", { class:`person c-${p.comunidade}` },
    h("div", { class:"avatar", "aria-hidden": foto ? null : "true" }, foto ? h("img", { src:foto, alt:p.nome }) : ini),
    h("h3", {}, p.nome, demo(p)),
    h("div", { class:"role" }, p.cargo),
    tag(p.comunidade),
    url ? h("a", { class:"linkish", href:url, target:"_blank", rel:"noopener" }, "Entrar em contato") : null);
}
const empty = msg => h("p", { class:"empty" }, msg);
const listOr = (items, render, msg) => items.length ? items.map(render) : [empty(msg)];
const sec = (t, c) => h("h2", { class:`sec${c ? " c-" + c : ""}` }, t);

/* faixa de abertura */
function band(cls, title, sub, extra){
  return h("header", { class:`band ${cls}` },
    h("span", { class:"squig tl", "aria-hidden":"true" }), h("span", { class:"squig br", "aria-hidden":"true" }),
    h("div", { class:"band-in" },
      h("h1", {}, h("span", { class:"tt" }, title)),
      sub ? h("p", { class:"band-sub" }, sub) : null, extra));
}
const wrap = (...k) => h("div", { class:"wrap" }, ...k);

/* ---------- páginas ---------- */
function pageInicio(){
  const hero = h("header", { class:"band hero c-pink" },
    h("span", { class:"squig tl", "aria-hidden":"true" }), h("span", { class:"squig br", "aria-hidden":"true" }),
    h("div", { class:"band-in" },
      h("span", { class:"logo", role:"img", "aria-label":"Logo do Núcleo Central" }),
      h("h1", {}, CONTENT.nome),
      h("p", { class:"band-sub" }, "portal do time central e da rede")));
  const tiles = CONTENT.comunidades.map(c => {
    const mats = CONTENT.materiais.filter(m => m.comunidade === c.id).length;
    const prox = proximos().find(e => e.comunidade === c.id);
    return h("a", { class:`tile c-${c.id}`, href:`#/c/${c.id}` },
      h("span", { class:"tt" }, c.nome),
      h("span", { class:"tile-desc" }, c.descricao),
      h("span", { class:"tile-meta" }, prox ? `Próximo encontro: ${fmtDay(parseDate(prox.data))}` : plural(mats, "material", "materiais")));
  });
  return [hero, patch(2), wrap(
    h("h2", { class:"sec home-h c-pink" }, "comunidades"),
    h("div", { class:"tiles" }, tiles),
    h("div", { class:"cols" },
      h("section", {}, sec("últimos avisos"), listOr(avisosOrd().slice(0,3), postEl, "Nenhum aviso por enquanto."),
        h("p", { style:"margin-top:14px" }, h("a", { class:"linkish", href:"#/avisos" }, "Ver todos os avisos"))),
      h("section", {}, sec("próximos eventos"), listOr(proximos().slice(0,3), e => eventEl(e, false), "Nenhum evento marcado por enquanto."),
        h("p", { style:"margin-top:14px" }, h("a", { class:"linkish", href:"#/agenda" }, "Ver a agenda completa")))))];
}

function pageAvisos(){
  const results = h("div", { "aria-live":"polite" });
  const upd = () => results.replaceChildren(...listOr(byCom(avisosOrd(), F.avisos), postEl, "Nenhum aviso neste filtro."));
  upd();
  return [band("c-pink", "avisos", "Novidades e comunicados do núcleo, do mais recente para o mais antigo."), wrap(chips("avisos", upd), results)];
}

function pageMateriais(){
  const results = h("div", { "aria-live":"polite" });
  const count = h("p", { class:"count" });
  const input = h("input", { class:"search", type:"search", placeholder:"Buscar por título ou descrição", "aria-label":"Buscar materiais", value:F.q });
  const upd = () => {
    const q = norm(F.q);
    const items = byCom(CONTENT.materiais, F.materiais).filter(m => !q || norm(m.titulo + " " + (m.descricao || "")).includes(q));
    count.textContent = plural(items.length, "material encontrado", "materiais encontrados");
    results.replaceChildren(...listOr(items, matEl, "Nenhum material encontrado. Tente outra palavra ou outro filtro."));
  };
  input.addEventListener("input", () => { F.q = input.value; upd(); });
  upd();
  return [band("c-wine", "materiais e documentos", "Guias, planilhas, gravações e links úteis reunidos num só lugar."), wrap(input, chips("materiais", upd), count, results)];
}

function pageAgenda(){
  const results = h("div", { "aria-live":"polite" });
  const upd = () => {
    const up = byCom(proximos(), F.agenda), pa = byCom(passados(), F.agenda);
    const nodes = [];
    if (!up.length) nodes.push(empty("Nenhum evento marcado neste filtro."));
    let mes = "";
    up.forEach(e => {
      const m = fmtMonth(parseDate(e.data));
      if (m !== mes){ mes = m; nodes.push(h("h2", { class:"sec", style:"font-size:18px;margin:30px 0 4px;text-transform:capitalize" }, m)); }
      nodes.push(eventEl(e, false));
    });
    if (pa.length) nodes.push(h("details", { class:"past-wrap" }, h("summary", {}, `Já aconteceram (${pa.length})`), ...pa.map(e => eventEl(e, true))));
    results.replaceChildren(...nodes);
  };
  upd();
  return [band("c-rose", "agenda", "Encontros, prazos e eventos da rede."), wrap(chips("agenda", upd), results)];
}

function pageTime(){
  const results = h("div", { class:"people", "aria-live":"polite" });
  const upd = () => results.replaceChildren(...listOr(byCom(CONTENT.time, F.time), personEl, "Ninguém neste filtro."));
  upd();
  return [band("c-blush", "time central", "Quem está por trás do núcleo e de cada comunidade."), wrap(chips("time", upd), results)];
}

function pageComunidade(c){
  const link = safeUrl(c.chat && c.chat.url);
  const btn = link
    ? h("a", { class:"btn", href:link, target:"_blank", rel:"noopener" }, c.chat.rotulo || "Entrar no chat")
    : h("span", { class:"btn", "aria-disabled":"true" }, "Link do chat em breve");
  const av = avisosOrd().filter(a => a.comunidade === c.id);
  const ma = CONTENT.materiais.filter(m => m.comunidade === c.id);
  const ev = proximos().filter(e => e.comunidade === c.id);
  const tm = CONTENT.time.filter(p => p.comunidade === c.id);
  return [band(`c-${c.id}`, c.nome, c.descricao, btn), wrap(
    h("div", { class:`c-${c.id}` },
      sec("avisos", c.id), ...listOr(av, postEl, "Nenhum aviso desta comunidade por enquanto."),
      sec("próximos eventos", c.id), ...listOr(ev, e => eventEl(e, false), "Nenhum evento marcado por enquanto."),
      sec("materiais", c.id), ...listOr(ma, matEl, "Nenhum material desta comunidade por enquanto."),
      sec("time da comunidade", c.id), h("div", { class:"people" }, listOr(tm, personEl, "Time ainda não divulgado."))))];
}

function pageMaterial(m){
  const paras = (m.corpo || "").split(/\n\n+/).map(p => h("p", { style:"margin-top:16px;max-width:66ch" }, p));
  return [band(`c-${m.comunidade}`, m.titulo, null),
    wrap(h("p", {}, h("a", { class:"linkish", href:"#/materiais" }, "← Voltar para materiais")),
      h("div", { style:"margin-top:18px" }, tag(m.comunidade), demo(m)),
      ...paras)];
}

/* ---------- navegação ---------- */
const NAV = [["", "Início"], ["avisos", "Avisos"], ["materiais", "Materiais e documentos"], ["agenda", "Agenda"], ["time", "Time central"]];
const side = document.getElementById("side"), scrim = document.getElementById("scrim"), menu = document.getElementById("menu"), main = document.getElementById("main");
const brandEl = (href) => h("a", { class:"brand", href }, h("span", { class:"lg", role:"img", "aria-label":"Logo do Núcleo Central" }), h("span", {}, "Núcleo", h("br"), "Central"));

function buildChrome(){
  document.getElementById("brand-top").replaceWith(Object.assign(brandEl("#/"), { id:"brand-top" }));
  if (CONTENT.rascunho) document.getElementById("draft").append(h("div", { class:"draft" }, "Versão de rascunho: os itens marcados como Exemplo serão substituídos pelo conteúdo real."));
  side.replaceChildren(brandEl("#/"),
    h("div", { class:"grp" }, "Espaços"),
    ...NAV.map(([id, label]) => h("a", { class:"nav", href:`#/${id}`, "data-r":id }, label)),
    h("div", { class:"grp" }, "Comunidades"),
    ...CONTENT.comunidades.map(c => h("a", { class:`nav c-${c.id}`, href:`#/c/${c.id}`, "data-r":`c/${c.id}` }, h("span", { class:"dot" }), c.nome)));
}
function setMenu(open){
  side.classList.toggle("open", open); scrim.classList.toggle("on", open);
  menu.setAttribute("aria-expanded", String(open));
}
menu.addEventListener("click", () => setMenu(!side.classList.contains("open")));
scrim.addEventListener("click", () => setMenu(false));
document.addEventListener("keydown", e => { if (e.key === "Escape") setMenu(false); });

function render(){
  const r = location.hash.replace(/^#\/?/, "");
  const [a, b] = r.split("/");
  let view, title = CONTENT.nome, key = a || "";
  const mat = a === "m" ? CONTENT.materiais.find(m => matSlug(m) === b) : null;
  if (a === "c" && COM[b]){ view = pageComunidade(COM[b]); title = `${COM[b].nome} · ${CONTENT.nome}`; key = `c/${b}`; }
  else if (mat){ view = pageMaterial(mat); title = `${mat.titulo} · ${CONTENT.nome}`; key = "materiais"; }
  else if (a === "avisos"){ view = pageAvisos(); title = `Avisos · ${CONTENT.nome}`; }
  else if (a === "materiais"){ view = pageMateriais(); title = `Materiais · ${CONTENT.nome}`; }
  else if (a === "agenda"){ view = pageAgenda(); title = `Agenda · ${CONTENT.nome}`; }
  else if (a === "time"){ view = pageTime(); title = `Time central · ${CONTENT.nome}`; }
  else { view = pageInicio(); key = ""; }
  const foot = h("footer", { class:"wrap", style:"padding-top:0" }, h("p", { class:"foot" }, `Atualizado em ${fmtFull(parseDate(CONTENT.atualizadoEm))}.`));
  main.replaceChildren(...view, foot, patch(1));
  document.title = title;
  side.querySelectorAll(".nav").forEach(n => n.getAttribute("data-r") === key ? n.setAttribute("aria-current", "page") : n.removeAttribute("aria-current"));
  setMenu(false); window.scrollTo(0, 0); main.focus({ preventScroll:true });
}
buildChrome();
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
